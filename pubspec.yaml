name: transquare
description: "A powerful translation tool for academic reading on Windows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP client for translation APIs
  http: ^1.3.0

  # Local storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Excel (xlsx) import/export for glossary
  excel: ^4.0.6

  # Low-level xlsx parsing (avoids excel package strict validation bugs)
  archive: ^3.6.1
  xml: ^6.6.1

  # File picker for import/export dialogs
  file_picker: ^8.0.0

  # Window management (frameless, always-on-top, multi-window)
  window_manager: ^0.5.1

  # System tray
  system_tray: ^0.1.1

  # Global hotkeys
  hotkey_manager: ^0.2.3

  # Useful utilities
  collection: ^1.19.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/